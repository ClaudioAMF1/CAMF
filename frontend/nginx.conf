server {
    listen 80;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    root /usr/share/nginx/html;

    # Os arquivos de /assets têm o hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html nunca fica em cache: é ele que aponta para os assets novos.
    # Sem isso o navegador podia seguir mostrando a versão antiga depois de
    # um "docker compose up --build".
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
